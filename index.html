function safeLoad(){

      if(oldBest>0){bestScores.normal=oldBest;migrated=true}
      const oldRaw=storageGet('brk-sv');
      if(oldRaw){try{
        const old=JSON.parse(oldRaw)||{};
        if(Number(old.g)>0){gems+=Math.floor(Number(old.g));migrated=true}
        const oldA=validObject(old.a,{});
        if(oldA[0]){achievements.stage5=true;migrated=true}
        if(oldA[1]){achievements.combo20=true;ownedSkins.push('gold');migrated=true}
        if(oldA[2]){achievements.boss1=true;ownedSkins.push('rose');migrated=true}
        if(oldA[3]){achievements.score10k=true;ownedSkins.push('lime');migrated=true}
        const oldU=validObject(old.u,{});
        if(oldU.life){upgrades.startLife=clamp(Number(oldU.life)||0,0,2);migrated=true}
        if(oldU.coin){upgrades.startCoin=clamp(Number(oldU.coin)||0,0,5);migrated=true}
        if(oldU.gauge){upgrades.startGauge=clamp(Number(oldU.gauge)||0,0,3);migrated=true}
        const oldSkins=['rainbow','cyan','gold','rose','lime'];
        if(Number.isInteger(old.s)&&oldSkins[old.s]){skin=oldSkins[old.s];if(!ownedSkins.includes(skin))ownedSkins.push(skin);migrated=true}
      }catch(_){}}
      if(migrated)save();
      return;
    }
    const d=JSON.parse(raw);if(!d||typeof d!=='object')return;
    bestScores=validObject(d.bestScores,{});
    stats=Object.assign({runs:0,blocks:0,bosses:0,bestCombo:0,bestRun:0,maxStage:1,breaks:0,perfects:0,coinsEarned:0},validObject(d.stats,{}));

    customGrid=Array.isArray(d.customGrid)&&d.customGrid.length===80?d.customGrid.map(x=>clamp(Math.floor(Number(x)||0),0,6)):Array(80).fill(0);

}
function save(){

    else if(screen==='pause'&&pausedFrom==='play')runCheckpoint=makeRunCheckpoint('play');
    else if(screen==='over')runCheckpoint=null;
    storageSet('break-rush-save-v3',JSON.stringify({version:4,bestScores,stats,achievements,workshop:upgrades,settings,skin,ownedSkins,gems,customGrid,runCheckpoint}));
  }catch(e){console.warn('保存データを作成できませんでした',e)}
}

  if(combo>=2){const mult=Math.min(8,1+Math.floor(combo/(6-Math.min(3,upgradesRun.combo||0))*.5));const cy=activeBoss?107:91;rounded(W-105,activeBoss?96:80,92,22,8,'#261b39e8','#ff83d86b');text('×'+mult+'  COMBO '+combo,W-59,cy,9,'#ffe17a','center',950)}
  if(combo>=5&&!activeBoss){const heat=clamp(combo/35,0,1);ctx.save();ctx.globalAlpha=.35+heat*.3;ctx.strokeStyle=combo>=20?'#ff72d0':'#ffe17a';ctx.shadowColor=ctx.strokeStyle;ctx.shadowBlur=10;ctx.lineWidth=2;ctx.beginPath();ctx.arc(W/2,138,16+Math.sin(worldTime*9)*2,Math.PI*.15,Math.PI*(1.05+heat*.8));ctx.stroke();ctx.globalAlpha=1;ctx.restore()}
  if(stage>=6){ctx.fillStyle='#ff527c88';ctx.fillRect(9,PADDLE_Y-43,W-18,1);text('DANGER LINE',W-13,PADDLE_Y-51,8,'#ff91ab','right',900)}
  if(balls.some(b=>b.stuck)){rounded(W/2-93,PADDLE_Y-63,186,22,9,'#08152bda','#7edcfb35');text('TAP / SPACE  TO LAUNCH',W/2,PADDLE_Y-52,10,'#d8edff','center',900)}
  // Small edge indicators make the lower playfield feel like a physical arcade cabinet.
  for(let i=0;i<3;i++){ctx.fillStyle=(gauge>=100?'#ff82d8':currentSkin().glow)+(i===0?'cc':i===1?'75':'35');ctx.fillRect(10+i*7,H-8,4,2)}
  ctx.restore()
}
function drawParticles(){ctx.save();for(const p of particles){ctx.globalAlpha=clamp(p.life/p.max,0,1);ctx.fillStyle=p.color;ctx.shadowColor=p.color;ctx.shadowBlur=settings.reduced?0:6;ctx.fillRect(p.x,p.y,p.size,p.size)}ctx.globalAlpha=1;ctx.shadowBlur=0;ctx.restore()}
function drawTexts(){ctx.save();for(const t of texts){ctx.globalAlpha=clamp(t.life/t.max,0,1);text(t.text,t.x,t.y,t.big?25:14,t.color,'center',950)}ctx.globalAlpha=1;ctx.restore()}
function drawTitleBackdrop(){
  ctx.save();
  const halo=ctx.createRadialGradient(W*.72,H*.28,2,W*.72,H*.28,260);halo.addColorStop(0,'#6c4cff1b');halo.addColorStop(.55,'#2fcaff0a');halo.addColorStop(1,'#00000000');ctx.fillStyle=halo;ctx.fillRect(0,0,W,H);
  for(let i=0;i<12;i++){const x=18+i*43+Math.sin(worldTime*.42+i)*13,y=110+(i%4)*142+Math.cos(worldTime*.65+i)*19;const col=['#62e7ff','#ff83d8','#ffe17a','#9d8cff'][i%4];ctx.strokeStyle=col+'66';ctx.lineWidth=1;ctx.shadowColor=col;ctx.shadowBlur=10;ctx.strokeRect(x,y,26+(i%3)*4,9+(i%2)*3)}ctx.shadowBlur=0;
  ctx.globalAlpha=.2;ctx.strokeStyle='#80dfff';ctx.beginPath();ctx.ellipse(260,360,235,75,Math.sin(worldTime*.2)*.1,0,Math.PI*2);ctx.stroke();ctx.strokeStyle='#d781ff';ctx.beginPath();ctx.ellipse(260,360,190,48,-.3,0,Math.PI*2);ctx.stroke();ctx.globalAlpha=1;
  // Moving light trails in the empty areas behind the title card.
  for(let i=0;i<5;i++){const y=(i*173+worldTime*38)%(H+60)-30;ctx.globalAlpha=.1;const lg=ctx.createLinearGradient(0,y,W,y-12);lg.addColorStop(0,'#0000');lg.addColorStop(.48,['#65eaff','#ff83d8','#9a8aff'][i%3]);lg.addColorStop(1,'#0000');ctx.fillStyle=lg;ctx.fillRect(0,y,W,2)}ctx.globalAlpha=1;ctx.restore();
}
function drawSamplePlay(){
  // Decorative arena visible behind translucent title UI, not a second game instance.
  ctx.save();ctx.globalAlpha=.62;const base=430;for(let r=0;r<4;r++)for(let c=0;c<8;c++){const x=38+c*51+Math.sin(worldTime*.8+r*.7+c*.24)*3,y=base+r*23+Math.cos(worldTime*.6+c)*2;const color=['#49cbff','#9a87ff','#ff80d7','#ffe17a'][(r+c)%4];ctx.shadowColor=color;ctx.shadowBlur=7;const gg=ctx.createLinearGradient(x,y,x,y+17);gg.addColorStop(0,color);gg.addColorStop(1,shade(color,-38));rounded(x,y,43,16,4,gg,'#ffffff44')}ctx.shadowBlur=0;ctx.globalAlpha=1;
  const bx=240+Math.sin(worldTime*1.22)*145,by=570+Math.cos(worldTime*1.7)*28;ctx.save();ctx.strokeStyle='#68efff77';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(bx-48,by+15);ctx.lineTo(bx-5,by+2);ctx.stroke();ctx.shadowColor='#6bf1ff';ctx.shadowBlur=22;const orb=ctx.createRadialGradient(bx-3,by-3,1,bx,by,11);orb.addColorStop(0,'#fff');orb.addColorStop(.45,'#bafaff');orb.addColorStop(1,'#3db9ff');ctx.fillStyle=orb;ctx.beginPath();ctx.arc(bx,by,7,0,Math.PI*2);ctx.fill();ctx.restore();ctx.shadowColor='#53dfff';ctx.shadowBlur=17;rounded(192+Math.sin(worldTime*.7)*68,665,96,12,6,'#53d8ff','#d8fcff');ctx.shadowBlur=0;
  ctx.globalAlpha=.22;ctx.strokeStyle='#6af3ff';ctx.beginPath();ctx.moveTo(18,704);ctx.lineTo(462,704);ctx.stroke();ctx.globalAlpha=1;ctx.restore();
}
function drawEditorBackdrop(){ctx.save();ctx.globalAlpha=.23;for(let i=0;i<80;i++){const r=Math.floor(i/10),c=i%10;ctx.strokeStyle='#5d7ba8';ctx.strokeRect(20+c*44,104+r*27,40,22)}ctx.restore()}
function drawToast(){ctx.save();ctx.globalAlpha=clamp(toastTimer*2,0,1);rounded(26,H-85,W-52,42,12,'#101a32ed','#8ba9dc66');text(screenToast,W/2,H-64,12,'#fff');ctx.restore()}
function currentSkin(){return SKINS.find(s=>s.id===skin)||SKINS[0]}
function fit(){const s=Math.min(window.innerWidth/W,window.innerHeight/H,1.22);scale=s;const game=$('game');game.style.width=W+'px';game.style.height=H+'px';game.style.transformOrigin='center center';game.style.transform=`scale(${s})`}window.addEventListener('resize',fit);fit();showTitle();
function loop(ts){const dt=Math.min(.034,(ts-(lastFrame||ts))/1000||0);lastFrame=ts;update(dt);if((screen==='play'||screen==='clear'||screen==='shop'||(screen==='pause'&&pausedFrom==='play'))&&worldTime-lastSaveAt>=2){lastSaveAt=worldTime;save()}draw();updateButtons();requestAnimationFrame(loop)}window.addEventListener('pagehide',()=>save());window.addEventListener('beforeunload',()=>save());requestAnimationFrame(loop);
})();
</script>
